{% load static %}
<section>

<!-- Top Utility Bar -->
<div class="bg-dark text-white py-2" style="background-color: #000000 !important;">
  <div class="container d-flex justify-content-between align-items-center">

    <!-- Centered Logo and Title -->
    <div class="mx-auto d-flex align-items-center">
      <img src="{% static 'image/logo.png' %}" alt="Site Logo" style="height: 30px; margin-right: 10px;">
      <span class="fw-bold fs-5">HardwarePickerBD</span>
    </div>

    <!-- Auth Buttons with Conditional Logic -->
    <div class="position-absolute end-0 me-3">
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="btn btn-sm btn-light text-dark me-2">
          {{ user.username }}
        </a>
        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">
          Logout
        </a>
      {% else %}
        <a href="{% url 'register' %}" class="btn btn-sm btn-outline-light me-2">Register</a>
        <a href="{% url 'login' %}" class="btn btn-sm btn-light text-dark">Login</a>
      {% endif %}
    </div>

  </div>
</div>

  <!-- Navbar Start -->
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e7e7ff !important;">
    <a class="navbar-brand" href="{% url 'home' %}" style="margin-left: 30px;">
      <i class="fa-solid fa-house" style="color: #000000;"></i> <!-- Changed to black for visibility -->
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="{% url 'cpu' %}">Builder <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'guide_list' %}">Guides</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'blog' %}">BuildHub</a>
        </li>
        <!-- Optional My Builds link -->
        <!--
        <li class="nav-item">
          <a class="nav-link" href="{% url 'order_list' %}">My Builds</a>
        </li>
        -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'cart_view' %}">Cart</a>
        </li>
      </ul>
    </div>
  </nav>
  <!-- Navbar End -->

</section>
